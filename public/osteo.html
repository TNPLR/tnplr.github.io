<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>骨科刷題</title>
  <style>
    :root { color-scheme: light; font: 100%/1.6 system-ui, sans-serif; color: #172538; background: #eef3f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2rem, 46rem); margin: 2rem auto; }
    h1, h2 { line-height: 1.4; margin-block: 0 .75rem; }
    h1 { font-size: clamp(1.65rem, 6vw, 2.25rem); }
    h2 { font-size: 1.25rem; }
    p { margin-block: .5rem; }
    header, .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; }
    .card { background: white; border: 1px solid #d4dee9; border-radius: 1rem; padding: clamp(1rem, 4vw, 1.75rem); margin-block: 1rem; }
    .muted { color: #475b71; font-size: .925rem; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin-block: .75rem; }
    .stats div { padding: .5rem; background: #f0f5fb; border-radius: .5rem; text-align: center; }
    dt { font-size: .875rem; }
    dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
    button, select, input { font: inherit; min-height: 2.75rem; border: 1px solid #7a8fa6; border-radius: .5rem; padding: .45rem .8rem; background: white; color: inherit; }
    input { width: 100%; margin-block: .4rem 1rem; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    .primary { background: #154779; border-color: #154779; color: white; font-weight: 650; }
    .primary:disabled { opacity: .66; }
    :focus-visible { outline: 3px solid #216fbe; outline-offset: 3px; }
    #options { display: grid; gap: .55rem; margin-block: 1rem; }
    .option { width: 100%; text-align: start; overflow-wrap: anywhere; }
    .option:not(:disabled):hover { background: #eef5fc; }
    .correct { background: #e5f5ed; border-color: #388163; }
    .incorrect { background: #fce9e8; border-color: #ad4e4c; }
    #feedback { font-weight: 700; }
    #details { padding-inline-start: 1.55rem; }
    #details li { margin-block: .55rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>骨科刷題</h1>
      <button id="lock" type="button" hidden>鎖定</button>
    </header>
    <form id="login" class="card">
      <label for="password">輸入密碼解鎖題庫</label>
      <input id="password" type="password" inputmode="numeric" autocomplete="off" required>
      <button id="unlock" class="primary" type="submit">解鎖</button>
      <p id="login-status" role="status"></p>
    </form>
    <section id="quiz" hidden>
      <div class="card">
        <div class="row">
          <label for="mode">出題方式</label>
          <select id="mode">
            <option value="correct">答對次數最少</option>
            <option value="attempts">作答次數最少</option>
            <option value="sequential">依題號順序</option>
            <option value="review">考前複習</option>
          </select>
        </div>
        <form id="jump" class="row">
          <label for="question-id">指定題號</label>
          <select id="question-id"></select>
          <button type="submit">前往題目</button>
        </form>
        <dl id="total" class="stats" aria-label="累計作答"></dl>
        <p id="storage-status" class="muted" role="status"></p>
      </div>
      <p id="review-status" class="card" role="status" hidden></p>
      <article id="question-card" class="card" aria-labelledby="stem">
        <p id="number" class="muted"></p>
        <h2 id="stem" tabindex="-1"></h2>
        <p id="question-stats" class="muted"></p>
        <div id="options"></div>
        <p id="feedback" role="status"></p>
        <p id="note" hidden></p>
        <p id="reference" class="muted" hidden></p>
        <ul id="details" hidden></ul>
        <button id="next" class="primary" type="button" hidden>下一題</button>
      </article>
    </section>
    <noscript>請啟用 JavaScript 以解鎖題庫。</noscript>
  </main>

  <script type="module">
    const byId = (id) => document.getElementById(id);
    const bank = JSON.parse(byId('encrypted-bank').textContent);
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const storageId = 'osteo.progress.v1';
    const storageContext = encoder.encode(storageId);
    const emptyCount = { attempts: 0, correct: 0, incorrect: 0 };
    let session = null;
    let generation = 0;

    function decode(value) {
      return Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
    }

    function encode(value) {
      return btoa(Array.from(new Uint8Array(value), (byte) => String.fromCharCode(byte)).join(''));
    }

    async function decrypt(key, record, context) {
      const plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: decode(record.iv), additionalData: context },
        key, decode(record.data)
      );
      return JSON.parse(decoder.decode(plain));
    }

    function lock() {
      byId('question-id').replaceChildren();
      generation++;
      session = null;
      byId('password').value = '';
      byId('login-status').textContent = '';
      byId('unlock').disabled = false;
      byId('quiz').hidden = true;
      byId('lock').hidden = true;
      byId('login').hidden = false;
      for (const id of ['total', 'number', 'stem', 'question-stats', 'options', 'feedback', 'note', 'reference', 'details', 'storage-status']) {
        byId(id).replaceChildren();
      }
    }

    async function readProgress(key) {
      const record = localStorage.getItem(storageId);
      return record ? decrypt(key, JSON.parse(record), storageContext) : {};
    }

    async function recordAnswer(active, id, correct) {
      const update = async () => {
        const latest = await readProgress(active.key);
        const before = latest[id] ?? emptyCount;
        latest[id] = {
          attempts: before.attempts + 1,
          correct: before.correct + Number(correct),
          incorrect: before.incorrect + Number(!correct)
        };
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv, additionalData: storageContext },
          active.key, encoder.encode(JSON.stringify(latest))
        );
        localStorage.setItem(storageId, JSON.stringify({ iv: encode(iv), data: encode(encrypted) }));
        return latest;
      };

      return navigator.locks ? navigator.locks.request(storageId, update) : update();
    }

    function showStats() {
      const total = { ...emptyCount };
      for (const count of Object.values(session.progress)) {
        for (const field of Object.keys(total)) total[field] += count[field];
      }
      const groups = Object.entries({ attempts: '作答', correct: '答對', incorrect: '答錯' }).map(([field, label]) => {
        const group = document.createElement('div');
        const title = document.createElement('dt');
        const value = document.createElement('dd');
        title.textContent = label;
        value.textContent = total[field];
        group.append(title, value);
        return group;
      });
      byId('total').replaceChildren(...groups);
      if (!session.current) return;
      const count = session.progress[session.current.id] ?? emptyCount;
      byId('question-stats').textContent = `本題作答 ${count.attempts} 次 · 答對 ${count.correct} 次 · 答錯 ${count.incorrect} 次`;
    }

    function pickNextQuestion() {
      const mode = byId('mode').value;
      if (mode === 'review') {
        const mistakes = (question) => session.progress[question.id]?.incorrect ?? 0;
        return session.questions
          .filter((question) => mistakes(question) > 0 && !session.reviewed.has(question.id))
          .sort((a, b) => mistakes(b) - mistakes(a) || a.id - b.id)[0];
      }
      if (mode === 'sequential') {
        const index = session.questions.indexOf(session.current);
        return session.questions[index + 1] ?? session.questions[0];
      }
      const count = (question) => (session.progress[question.id] ?? emptyCount)[mode];
      const minimum = Math.min(...session.questions.map(count));
      const tied = session.questions.filter((question) => count(question) === minimum);
      const pool = tied.length > 1 ? tied.filter((question) => question !== session.current) : tied;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function drawQuestion(question = pickNextQuestion()) {
      session.current = question;
      session.answered = false;
      byId('question-card').hidden = !question;
      byId('review-status').hidden = Boolean(question);
      byId('review-status').textContent = question ? '' : session.reviewed.size
        ? '本輪考前複習完成。切換出題方式後，可再開始一輪。'
        : '目前沒有答錯過的題目可複習。';
      if (!question) {
        showStats();
        byId('mode').focus();
        return;
      }
      byId('question-id').value = question.id;
      byId('number').textContent = `原題第 ${question.id} 題 · 題庫共 ${session.questions.length} 題`;
      byId('stem').textContent = question.stem;
      byId('feedback').textContent = '';
      byId('note').hidden = true;
      byId('note').textContent = '';
      byId('reference').replaceChildren();
      byId('reference').hidden = true;
      byId('details').replaceChildren();
      byId('details').hidden = true;
      byId('next').hidden = true;
      byId('options').replaceChildren(...question.options.map(([label, text]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        button.textContent = `${label}. ${text}`;
        button.addEventListener('click', () => answer(label));
        return button;
      }));
      showStats();
      byId('stem').focus();
    }

    async function answer(choice) {
      const active = session;
      if (!active || active.answered) return;
      active.answered = true;
      if (byId('mode').value === 'review') active.reviewed.add(active.current.id);
      byId('mode').disabled = true;
      byId('jump').querySelector('button').disabled = true;
      const question = active.current;
      const correct = choice === question.key;
      for (const [index, button] of Array.from(byId('options').children).entries()) {
        const [label] = question.options[index];
        button.disabled = true;
        if (label === question.key) button.classList.add('correct');
        else if (label === choice) button.classList.add('incorrect');
      }
      byId('feedback').textContent = `${correct ? '答對了' : '答錯了'}。原題答案為 ${question.key}。`;
      if (question.note) {
        byId('note').textContent = question.note;
        byId('note').hidden = false;
      }
      byId('details').replaceChildren(...question.options.map(([label, text], index) => {
        const item = document.createElement('li');
        item.textContent = `${label}. ${text} — ${question.explanations[index]}`;
        return item;
      }));
      byId('details').hidden = false;
      if (question.reference) {
        const link = document.createElement('a');
        link.href = question.reference.url;
        link.textContent = question.reference.label;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        byId('reference').replaceChildren(link);
        byId('reference').hidden = false;
      }

      try {
        active.progress = await recordAnswer(active, question.id, correct);
        if (session === active) byId('storage-status').textContent = '進度已加密儲存在此瀏覽器。';
      } catch {
        const before = active.progress[question.id] ?? emptyCount;
        active.progress[question.id] = {
          attempts: before.attempts + 1,
          correct: before.correct + Number(correct),
          incorrect: before.incorrect + Number(!correct)
        };
        if (session === active) byId('storage-status').textContent = '本次進度無法寫入，只會保留在這次開啟的頁面。';
      }
      if (session !== active) return;
      showStats();
      byId('mode').disabled = false;
      byId('jump').querySelector('button').disabled = false;
      updateNextLabel();
      byId('next').hidden = false;
    }

    byId('login').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (byId('unlock').disabled) return;
      const attempt = ++generation;
      const password = encoder.encode(byId('password').value);
      byId('password').value = '';
      byId('unlock').disabled = true;
      byId('login-status').textContent = '驗證中…';
      try {
        if (!globalThis.crypto?.subtle) throw new Error('請透過 HTTPS 或本機伺服器開啟。');
        const material = await crypto.subtle.importKey('raw', password, 'PBKDF2', false, ['deriveKey']);
        password.fill(0);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: decode(bank.keySalt), iterations: bank.iterations, hash: 'SHA-256' },
          material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
        );
        let questions;
        try {
          questions = await decrypt(key, bank, encoder.encode('osteo.bank.v1'));
        } catch (error) {
          if (error.name === 'OperationError') throw new Error('密碼錯誤或題庫無法解密。');
          throw error;
        }
        let progress = {};
        let storageMessage = '進度會加密儲存在此瀏覽器。';
        try {
          progress = await readProgress(key);
        } catch {
          storageMessage = '無法讀取此瀏覽器的進度。若仍無法寫入，進度只會保留在這次開啟的頁面。';
        }
        if (attempt !== generation) return;
        questions.sort((a, b) => a.id - b.id);
        session = { key, questions, progress, current: null, answered: false, reviewed: new Set() };
        byId('question-id').replaceChildren(...questions.map(({ id }) => new Option(`第 ${id} 題`, id)));
        byId('jump').querySelector('button').disabled = false;
        byId('jump').hidden = false;
        byId('login-status').textContent = '';
        byId('storage-status').textContent = storageMessage;
        byId('login').hidden = true;
        byId('quiz').hidden = false;
        byId('lock').hidden = false;
        byId('mode').value = 'correct';
        byId('mode').disabled = false;
        drawQuestion();
      } catch (error) {
        if (attempt === generation) {
          byId('login-status').textContent = error.name === 'Error' ? error.message : '題庫解鎖失敗。';
          byId('password').focus();
        }
      } finally {
        password.fill(0);
        if (attempt === generation) byId('unlock').disabled = false;
      }
    });

    function updateNextLabel() {
      const atEnd = byId('mode').value === 'sequential' && session.current === session.questions.at(-1);
      byId('next').textContent = atEnd ? '回到第一題' : '下一題';
    }

    byId('mode').addEventListener('change', () => {
      if (!session) return;
      const mode = byId('mode').value;
      byId('jump').hidden = mode === 'review';
      if (mode === 'review') {
        session.reviewed.clear();
        drawQuestion();
      } else if (mode === 'sequential') drawQuestion(session.questions[0]);
      else if (!session.answered) drawQuestion();
      else updateNextLabel();
    });
    byId('jump').addEventListener('submit', (event) => {
      event.preventDefault();
      if (!session || byId('mode').disabled || byId('mode').value === 'review') return;
      const id = Number(byId('question-id').value);
      const question = session.questions.find((entry) => entry.id === id);
      if (question) drawQuestion(question);
    });
    byId('next').addEventListener('click', () => {
      if (session?.answered && !byId('next').hidden) drawQuestion();
    });
    window.addEventListener('storage', async (event) => {
      const active = session;
      if (event.key !== storageId || !active) return;
      try {
        const progress = await readProgress(active.key);
        if (session !== active || byId('mode').disabled) return;
        active.progress = progress;
        showStats();
      } catch {
        if (session === active) byId('storage-status').textContent = '無法同步其他分頁的作答進度。';
      }
    });
    byId('lock').addEventListener('click', () => {
      lock();
      byId('password').focus();
    });
    window.addEventListener('pagehide', lock);
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) lock();
    });
  </script>
</body>
</html>
